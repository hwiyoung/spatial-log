version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: samsdb
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sams_dev_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sams -d samsdb"]
      interval: 5s
      retries: 5

  pgstac-migrate:
    image: ghcr.io/stac-utils/pgstac:v0.9.1
    environment:
      PGHOST: db
      PGDATABASE: samsdb
      PGUSER: sams
      PGPASSWORD: ${DB_PASSWORD:-sams_dev_2024}
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:v3.0.0
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      POSTGRES_HOST_READER: db
      POSTGRES_HOST_WRITER: db
      POSTGRES_DBNAME: samsdb
      POSTGRES_USER: sams
      POSTGRES_PASS: ${DB_PASSWORD:-sams_dev_2024}
      POSTGRES_PORT: "5432"
    ports:
      - "8080:8080"
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully

  sams-api:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      - db
      - stac-api
      - minio
      - redis
    volumes:
      - upload_tmp:/tmp/uploads
      - ./sams-api:/app

  worker:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    command: celery -A sams.worker worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - minio
      - redis
    volumes:
      - upload_tmp:/tmp/uploads
      - ./sams-api:/app

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/sams-archive --ignore-existing;
      echo 'Bucket sams-archive created';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  miniodata:
  upload_tmp:
