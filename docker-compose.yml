services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: samsdb
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sams_dev_2024}
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-7432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sams -d samsdb"]
      interval: 5s
      retries: 5

  pgstac-migrate:
    image: python:3.11-slim
    environment:
      PGHOST: db
      PGDATABASE: samsdb
      PGUSER: sams
      PGPASSWORD: ${DB_PASSWORD:-sams_dev_2024}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        pip install --quiet pypgstac[psycopg]==0.9.1 &&
        pypgstac migrate
      "
    restart: "no"

  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      POSTGRES_HOST_READER: db
      POSTGRES_HOST_WRITER: db
      POSTGRES_DBNAME: samsdb
      POSTGRES_USER: sams
      POSTGRES_PASS: ${DB_PASSWORD:-sams_dev_2024}
      POSTGRES_PORT: "5432"
    ports:
      - "${STAC_API_HOST_PORT:-8080}:8080"
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully

  sams-api:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "${SAMS_API_HOST_PORT:-8000}:8000"
    depends_on:
      - db
      - stac-api
      - minio
      - redis
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/uploads:/tmp/uploads
      - ./sams-api:/app

  worker:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    command: celery -A sams.worker worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - minio
      - redis
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/uploads:/tmp/uploads
      - ./sams-api:/app

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/sams-archive --ignore-existing;
      echo 'Bucket sams-archive created';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - sams-api

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HOST_PORT:-7800}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - sams-api
      - stac-api
      - minio

  # 기본적으로 모든 데이터가 ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/ 에 bind mount됨
  # pgdata   → sams-data/pgdata/
  # miniodata → sams-data/minio/
  # uploads  → sams-data/uploads/
