services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: samsdb
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sams_dev_2024}
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-7432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sams -d samsdb"]
      interval: 5s
      retries: 5

  pgstac-migrate:
    image: python:3.11-slim
    environment:
      PGHOST: db
      PGDATABASE: samsdb
      PGUSER: sams
      PGPASSWORD: ${DB_PASSWORD:-sams_dev_2024}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        pip install --quiet pypgstac[psycopg]==0.9.1 &&
        pypgstac migrate
      "
    restart: "no"

  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      POSTGRES_HOST_READER: db
      POSTGRES_HOST_WRITER: db
      POSTGRES_DBNAME: samsdb
      POSTGRES_USER: sams
      POSTGRES_PASS: ${DB_PASSWORD:-sams_dev_2024}
      POSTGRES_PORT: "5432"
    ports:
      - "${STAC_API_HOST_PORT:-8080}:8080"
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully

  sams-api:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    # dev 기본값은 --reload. 배포 시 .env 의 SAMS_API_CMD 로 멀티워커(no reload)로 전환.
    command: ${SAMS_API_CMD:-uvicorn sams.main:app --host 0.0.0.0 --port 8000 --reload}
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      # 브라우저 직접 업로드(presigned PUT)용 — 호스트에서 접근 가능한 MinIO 주소
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_HOST_PORT:-9000}}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1TiB}
      WARN_UPLOAD_BYTES: ${WARN_UPLOAD_BYTES:-500GiB}
      UPLOAD_STALE_MULTIPART_SECONDS: ${UPLOAD_STALE_MULTIPART_SECONDS:-86400}
      UPLOAD_ANALYSIS_STALE_SECONDS: ${UPLOAD_ANALYSIS_STALE_SECONDS:-900}
      UPLOAD_CLEANUP_INTERVAL_SECONDS: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:-3600}
    ports:
      - "${SAMS_API_HOST_PORT:-8000}:8000"
    depends_on:
      - db
      - stac-api
      - minio
      - redis
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/uploads:/tmp/uploads
      - ./sams-api:/app

  worker:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    command: celery -A sams.worker worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1TiB}
      WARN_UPLOAD_BYTES: ${WARN_UPLOAD_BYTES:-500GiB}
      UPLOAD_STALE_MULTIPART_SECONDS: ${UPLOAD_STALE_MULTIPART_SECONDS:-86400}
      UPLOAD_ANALYSIS_STALE_SECONDS: ${UPLOAD_ANALYSIS_STALE_SECONDS:-900}
      UPLOAD_CLEANUP_INTERVAL_SECONDS: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:-3600}
    depends_on:
      - db
      - minio
      - redis
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/uploads:/tmp/uploads
      - ./sams-api:/app

  worker-beat:
    build:
      context: ./sams-api
      dockerfile: Dockerfile
    command: celery -A sams.worker beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://sams:${DB_PASSWORD:-sams_dev_2024}@db:5432/samsdb
      STAC_API_URL: http://stac-api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: sams-archive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1TiB}
      WARN_UPLOAD_BYTES: ${WARN_UPLOAD_BYTES:-500GiB}
      UPLOAD_STALE_MULTIPART_SECONDS: ${UPLOAD_STALE_MULTIPART_SECONDS:-86400}
      UPLOAD_ANALYSIS_STALE_SECONDS: ${UPLOAD_ANALYSIS_STALE_SECONDS:-900}
      UPLOAD_CLEANUP_INTERVAL_SECONDS: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:-3600}
    depends_on:
      - db
      - minio
      - redis
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/uploads:/tmp/uploads
      - ./sams-api:/app

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/sams-archive --ignore-existing;
      echo 'Bucket sams-archive created';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # dev 기본값은 Vite dev 서버. 배포 시 .env 의 FRONTEND_TARGET=prod 로 정적 빌드 서빙.
      target: ${FRONTEND_TARGET:-dev}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      VITE_DEV_API_PROXY_TARGET: ${VITE_DEV_API_PROXY_TARGET:-http://sams-api:8000}
      VITE_DEV_STAC_PROXY_TARGET: ${VITE_DEV_STAC_PROXY_TARGET:-http://stac-api:8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - sams-api

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HOST_PORT:-7800}:80"
    volumes:
      # dev 기본값은 nginx.conf(/minio 콘솔 노출). 배포 시 .env 의 NGINX_CONF_FILE=nginx.prod.conf.
      - ./nginx/${NGINX_CONF_FILE:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - sams-api
      - stac-api
      - minio

  # 기본적으로 모든 데이터가 ${SAMS_DATA_ROOT:-/media/innopam/InnoPAM-8TB/sams-data}/ 에 bind mount됨
  # pgdata   → sams-data/pgdata/
  # miniodata → sams-data/minio/
  # uploads  → sams-data/uploads/
