events {
    worker_connections 1024;
}

http {
    upstream sams_api {
        server sams-api:8000;
    }

    upstream stac_api {
        server stac-api:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        client_max_body_size 10G;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SAMS custom API
        location /api/ {
            proxy_pass http://sams_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # STAC standard API
        location /stac/ {
            rewrite ^/stac/(.*) /$1 break;
            proxy_pass http://stac_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MinIO console (dev only)
        location /minio/ {
            proxy_pass http://minio:9001/;
            proxy_set_header Host $host;
        }
    }
}
