# 내부 베타/정식 스택 nginx — dev 의 nginx.conf 에서 /minio 콘솔 제거 + 업로드 한도 상향.
# 대용량 업로드는 presigned 로 MinIO 직행하지만 API 경유분도 넉넉히 허용.
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        client_max_body_size 0;   # 무제한 (대용량 업로드 허용)

        set $frontend_upstream http://frontend:3000;
        set $sams_api_upstream http://sams-api:8000;
        set $stac_api_upstream http://stac-api:8080;
        set $minio_api_upstream http://minio:9000;

        # Frontend (prod: 정적 빌드 서빙)
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SAMS custom API
        location /api/ {
            proxy_pass $sams_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
        }

        # STAC standard API
        location /stac/ {
            rewrite ^/stac/(.*) /$1 break;
            proxy_pass $stac_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MinIO S3 API for browser presigned uploads. Bucket path is signed, so keep Host intact.
        location /sams-archive/ {
            proxy_pass $minio_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # NOTE: dev 의 /minio/ 콘솔 라우트는 내부 베타 스택 노출 방지를 위해 제거함.
    }
}
